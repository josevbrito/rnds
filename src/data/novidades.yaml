# Novidades do guia
#
# Cada entrada aparece na página /novidades, no RSS (/novidades.xml) e no aviso
# para quem volta ao site. Por isso só entra aqui mudança que importa para quem
# integra: portaria nova, modelo que mudou, fonte oficial que mudou de lugar.
# Correção de texto, link ou digitação NÃO entra, fica no histórico do git.
#
# A entrada não tem 'fontes' própria: aponta para os registros de portarias e
# modelos, que têm.
#
# O site ordena pela data, da mais recente para a mais antiga; no mesmo dia,
# pelo id em ordem alfabética. Escreva aqui na mesma ordem, para facilitar.
#
# Segunda novidade no mesmo dia? Ponha na data a hora em que ela foi publicada,
# por exemplo 2026-10-30T02:39:00-03:00, para a mais nova ficar em primeiro. É
# a primeira da lista que dispara o aviso para quem volta ao site. Não use hora
# futura: o RSS publica a data como está. Depois das 21h, a data exibida já é a
# do dia seguinte, porque o site mostra datas em UTC.

- id: decreto-12560-erros-acesso
  data: 2026-10-30T03:11:00-03:00
  titulo: Decreto nº 12.560/2025, catálogo de erros e credenciamento
  texto: >-
    O Decreto nº 12.560/2025, que disciplina a RNDS e determina que os modelos
    sejam pactuados na CIT e publicados em portaria, entra na linha do tempo; ele
    também falta na lista oficial do gov.br. A página de erros comuns passa a
    ensinar a ler o código que a RNDS devolve e a procurá-lo no catálogo oficial,
    e a página de acesso traz as evidências exigidas para pedir produção.
  portarias: [decreto-12560-2025]
  link: /erros-comuns/

- id: correcao-br-core-paciente-por-identificador
  data: 2026-10-30T03:05:00-03:00
  titulo: 'Correção: perfis não derivam do BR Core, e o paciente vai por identificador'
  texto: >-
    Duas correções a partir dos pacotes e exemplos oficiais do novo Guia de
    Implementação. Os perfis da RNDS derivam direto do FHIR base, não do BR
    Core, então a validação deve usar o pacote do modelo. E o paciente não entra
    no documento como Patient: vai por identificador, com o system fixado pelo
    perfil. O tutorial, a anatomia do documento e as páginas de identificadores
    e validação foram refeitos.
  link: /integracao/perfis-e-br-core/

- id: servicos-ambientes-guia-implementacao
  data: 2026-10-30T02:39:00-03:00
  titulo: Serviços e ambientes conferidos no novo Guia de Implementação
  texto: >-
    Entram cinco serviços documentados pelo guia: exclusão de documento,
    recuperação pelo ID RNDS, consulta pelo identificador local, consulta ao
    servidor e consulta de terminologia. A substituição de documento só pode ser
    feita uma vez. Em homologação, o endereço de dados passa a ser
    ehr-services-hmg.saude.gov.br, com hífen; o antigo, com ponto, fica
    registrado.
  link: /integracao/servicos/

- id: guia-implementacao-fhir-saude
  data: 2026-10-30
  titulo: Novo Guia de Implementação oficial em fhir.saude.gov.br
  texto: >-
    O Ministério da Saúde publicou um novo Guia de Implementação FHIR, com um
    guia geral e um guia por modelo. As fichas de RAC, REL, RIA, RIRA, SA e
    REDFM agora apontam para eles. O guia anterior, em rnds-fhir.saude.gov.br,
    continua no ar com o build de 2022.
  modelos: [rac, rel, ria, rira, sa, redfm]
  link: /ferramentas/ecossistema/

- id: modelos-atuais-rel-ria
  data: 2026-10-30
  titulo: Portarias atuais do REL e do RIA
  texto: >-
    O REL passa a ter como referência a Portaria GM/MS nº 8.276/2025, e o RIA a
    Portaria Conjunta SAES/SVSA/SEIDIGI nº 25/2023, duas normas que faltam na
    lista oficial do gov.br. No RIA, o perfil vigente é o RIA-R 2.0, que deve
    receber também as doses de campanha.
  portarias: [gm-ms-8276-2025, saes-svsa-seidigi-25-2023]
  modelos: [rel, ria]

- id: cmd-rati-ratc-relc
  data: 2026-10-09
  titulo: CMD ganha portaria e entram RATI, RATC e RELC
  texto: >-
    A Portaria GM/MS nº 11.952/2026 institui o modelo do CMD. Entram no
    catálogo três modelos: RATI, de teleinterconsulta, RATC, de
    teleconsultoria, e RELC, de resultado de exame com laudo clínico. Entra
    também a GM/MS nº 5.663/2024, que centraliza na RNDS os registros de
    vacinação.
  portarias: [gm-ms-11952-2026, gm-ms-10341-2026, gm-ms-8323-2025, gm-ms-5663-2024]
  modelos: [cmd, rati, ratc, relc]

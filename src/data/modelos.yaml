- id: ria
  sigla: RIA
  nome: Registro de Imunobiológico Administrado
  resumo: >-
    Dose de vacina aplicada, de rotina ou de campanha. O perfil vigente é o
    RIA-R 2.0, que desde fevereiro de 2026 deve receber todas as doses,
    inclusive as de campanha. O Programa Nacional de Imunizações anunciou a
    desativação do RIA Carga, do RIA-R 1.0 e do RIA-C 2.0, com cronograma a ser
    divulgado com antecedência.
  status: producao
  codigo_tipo_documento: RIA
  portaria_vigente: saes-svsa-seidigi-25-2023
  portarias: [saes-svsa-seidigi-25-2023, gm-ms-5663-2024, gm-ms-69-2021]
  ig_oficial: https://fhir.saude.gov.br/ria/
  ordem: 3
  fontes:
    - tipo: gov-br
      titulo: Estrutura do Projeto RNDS - SEIDIGI
      url: https://www.gov.br/saude/pt-br/composicao/seidigi/rnds/estrutura-do-projeto
    - tipo: dou
      titulo: Portaria GM/MS nº 5.663/2024 - centraliza na RNDS os registros de vacinação
      url: https://www.in.gov.br/web/dou/-/portaria-gm/ms-n-5.663-de-31-de-outubro-de-2024-593693777
    - tipo: outro
      titulo: Comunicado DPNI/SVSA/MS de 23/02/2026 sobre o RIA-R 2.0 (cópia publicada pela SBIm)
      url: https://sbim.org.br/images/SEI_MS-0053610638-Comunicado.pdf_2026-02-26.pdf
    - tipo: ig
      titulo: Guia de Implementação do RIA
      url: https://fhir.saude.gov.br/ria/
  verificado_em: 2026-10-30


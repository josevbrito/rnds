- id: redfm
  sigla: REDFM
  nome: Registro Eletrônico de Dispensação ou Fornecimento de Medicamentos
  resumo: >-
    Informações da dispensação de medicamento realizada por profissional
    farmacêutico, ou do fornecimento por profissional de saúde autorizado.
    Registra, no mínimo, o medicamento fornecido segundo a OBM, a quantidade, a
    data e hora, e a identificação do profissional responsável por CPF ou CNS.
    Sucede o RDM.
  status: producao
  portaria_vigente: gm-ms-6100-2024
  portarias: [gm-ms-6100-2024]
  sucede: rdm
  ig_oficial: https://rnds-fhir.saude.gov.br/
  ig_comunitario:

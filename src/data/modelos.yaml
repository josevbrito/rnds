# Modelos de Informação da RNDS
#
# São catorze os modelos catalogados aqui, sendo doze vigentes e dois mantidos como histórico.
#
# 'ig_oficial' aponta para o guia do modelo em https://fhir.saude.gov.br/. Fica
# vazio enquanto o modelo não tiver guia próprio publicado lá.
#
# 'codigo_tipo_documento' refere-se ao CodeSystem BRTipoDocumento:
#   https://rnds-fhir.saude.gov.br/CodeSystem-BRTipoDocumento.html
# Só é preenchido onde o código foi conferido. Ausência do campo significa
# "não verificado", nunca "não existe".

- id: rel
  sigla: REL
  nome: Resultado de Exame Laboratorial
  resumo: >-
    Laudo de exame laboratorial. Foi o primeiro modelo implantado na RNDS e
    segue sendo o mais maduro em exemplos e material de apoio, se você pode
    escolher por onde começar, comece por ele. O modelo vigente é o da Portaria
    GM/MS nº 8.276/2025.
  status: producao
  codigo_tipo_documento: REL
  portaria_vigente: gm-ms-8276-2025
  portarias: [gm-ms-8276-2025, saes-ms-883-2022, gm-ms-3328-2022, gm-ms-1046-2021, portaria-1068-2020, portaria-1792-2020]
  ig_oficial: https://fhir.saude.gov.br/rel/
  ordem: 1
  fontes:
    - tipo: ig
      titulo: Guia de Implementação do REL
      url: https://fhir.saude.gov.br/rel/
    - tipo: conass
      titulo: Conass Informa n. 175/2025 - Portaria GM/MS nº 8.276/2025
      url: https://www.conass.org.br/conass-informa-n-175-2025-publicada-a-portaria-gm-n-8-276-que-institui-o-modelo-de-informacao-de-resultado-de-exame-laboratorial-rel-no-ambito-da-rede-nacional-de-dados-em-saude-r/
    - tipo: ig
      titulo: Guia de Implementação anterior - exemplos de REL (v2 e v3.2.1)
      url: https://rnds-fhir.saude.gov.br/exemplos.html
  verificado_em: 2026-10-30


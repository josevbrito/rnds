- id: cmd
  sigla: CMD
  nome: Conjunto Mínimo de Dados
  resumo: >-
    Dados do contato assistencial. É o modelo de escopo mais amplo: parte do
    conceito de contato assistencial e foi desenhado para consolidar e
    substituir uma série de sistemas de informação anteriores. É a via de envio
    para estabelecimentos que não possuem prontuário eletrônico.
  status: producao

  verificado_em: 2026-08-26

- id: cmd
  sigla: CMD
  nome: Conjunto Mínimo de Dados
  resumo: >-
    Dados do contato assistencial. É o modelo de escopo mais amplo: parte do
    conceito de contato assistencial e foi desenhado para consolidar e
    substituir uma série de sistemas de informação anteriores. É a via de envio
    para estabelecimentos que não possuem prontuário eletrônico.
  status: producao
  codigo_tipo_documento: CMD
  portarias: []
  ig_oficial: https://rnds-fhir.saude.gov.br/
  ordem: 7
  fontes:
    - tipo: gov-br
      titulo: Wiki do CMD - Ministério da Saúde (material de governança, não especificação técnica)
      url: https://wiki.saude.gov.br/cmd/index.php/P%C3%A1gina_principal
    - tipo: ig
      titulo: CodeSystem BRTipoDocumento
      url: https://rnds-fhir.saude.gov.br/CodeSystem-BRTipoDocumento.html
  verificado_em: 2026-08-26


# Modelos de Informação da RNDS
#
# São onze os modelos catalogados aqui, sendo nove vigentes e dois mantidos como histórico.
#
# 'codigo_tipo_documento' refere-se ao CodeSystem BRTipoDocumento:
#   https://rnds-fhir.saude.gov.br/CodeSystem-BRTipoDocumento.html
# Só é preenchido onde o código foi conferido. Ausência do campo significa
# "não verificado", nunca "não existe".

- id: rel
  sigla: REL
  nome: Resultado de Exame Laboratorial
  resumo: >-
    Laudo de exame laboratorial. Foi o primeiro modelo implantado na RNDS e
    segue sendo o mais maduro em exemplos e material de apoio, se você pode
    escolher por onde começar, comece por ele.
  status: producao
  codigo_tipo_documento: REL
  portaria_vigente: portaria-1068-2020
  portarias: [portaria-1068-2020, portaria-1792-2020, gm-ms-1046-2021, gm-ms-3328-2022]
  ig_oficial: https://rnds-fhir.saude.gov.br/
  ordem: 1
  fontes:
    - tipo: ig
      titulo: Guia de Implementação FHIR da RNDS - exemplos de REL (v2 e v3.2.1)
      url: https://rnds-fhir.saude.gov.br/exemplos.html
  verificado_em: 2026-08-26

- id: rac
  sigla: RAC
  nome: Registro de Atendimento Clínico
  resumo: >-
    Consulta realizada na atenção básica, especializada ou domiciliar. Reúne
    histórico clínico do pacientes: sintomas, medicamentos e procedimentos.
  status: producao
  codigo_tipo_documento: RAC
  portaria_vigente: gm-ms-8347-2025
  portarias: [gm-ms-8347-2025, gm-ms-234-2022]
  ig_oficial: https://rnds-fhir.saude.gov.br/
  ig_comunitario:
    - nome: RAC Implementation Guide
      autor: Igor Evangelista (igorevan)
      url: https://igorevan.github.io/rac-ig/
      repo: https://github.com/igorevan/rac-ig
  ordem: 2
  fontes:
    - tipo: gov-br
      titulo: Estrutura do Projeto RNDS - SEIDIGI
      url: https://www.gov.br/saude/pt-br/composicao/seidigi/rnds/estrutura-do-projeto
  verificado_em: 2026-08-26

- id: ria
  sigla: RIA
  nome: Registro de Imunobiológico Administrado
  resumo: >-
    Dose de vacina aplicada. Na operação da RNDS o modelo se desdobra em dois
    fluxos processados separadamente: RIA-R para vacinação de rotina e RIA-C
    para campanha.
  status: producao
  codigo_tipo_documento: RIA
  portaria_vigente: gm-ms-69-2021
  portarias: [gm-ms-69-2021]
  ig_oficial: https://rnds-fhir.saude.gov.br/
  ig_comunitario:
    - nome: RIA Implementation Guide
      autor: Igor Evangelista (igorevan)
      url: https://igorevan.github.io/ria-ig/
      repo: https://github.com/igorevan/ria-ig
  ordem: 3
  fontes:
    - tipo: gov-br
      titulo: Estrutura do Projeto RNDS - SEIDIGI
      url: https://www.gov.br/saude/pt-br/composicao/seidigi/rnds/estrutura-do-projeto
  verificado_em: 2026-08-26

- id: rira
  sigla: RIRA
  nome: Registro de Informações de Regulação Assistencial
  resumo: >-
    Dados da regulação assistencial no SUS, o fluxo de solicitação e
    autorização de procedimentos, para continuidade do cuidado e otimização de
    recursos.
  status: producao
  portaria_vigente: saes-seidigi-3-2023
  portarias: [saes-seidigi-3-2023]
  ig_oficial: https://rnds-fhir.saude.gov.br/
  ig_comunitario:
    - nome: RIRA Implementation Guide
      autor: Igor Evangelista (igorevan)
      url: https://igorevan.github.io/rira-ig/
      repo: https://github.com/igorevan/rira-ig
    - nome: Perfil Regulação Assistencial (Simplifier)
      autor: Projeto RNDS no Simplifier
      url: https://simplifier.net/redenacionaldedadosemsaude/brregulacaoassistencial
    - nome: Perfil Requisição de Regulação Assistencial (Simplifier)
      autor: Projeto RNDS no Simplifier
      url: https://simplifier.net/redenacionaldedadosemsaude/brrequisicaoregulacaoassistencial
  ordem: 4
  fontes:
    - tipo: gov-br
      titulo: Estrutura do Projeto RNDS - SEIDIGI
      url: https://www.gov.br/saude/pt-br/composicao/seidigi/rnds/estrutura-do-projeto
  verificado_em: 2026-08-26

- id: sa
  sigla: SA
  nome: Sumário de Alta
  resumo: >-
    Relatório clínico objetivo ao fim de uma internação: intervenções
    realizadas, orientações para continuidade do cuidado após a alta e estado
    de saúde do indivíduo no encerramento da estadia hospitalar.
  status: producao
  codigo_tipo_documento: SA
  portaria_vigente: gm-ms-8026-2025
  portarias: [gm-ms-8026-2025, portaria-701-2022]
  ig_oficial: https://rnds-fhir.saude.gov.br/
  ordem: 5
  fontes:
    - tipo: conass
      titulo: Conass Informa n. 151/2025
      url: https://www.conass.org.br/conass-informa-n-151-2025-publicada-a-portaria-gm-n-8-026-que-institui-o-modelo-de-informacao-do-sumario-de-alta-sa-no-ambito-da-rede-nacional-de-dados-em-saude-rnds/
  verificado_em: 2026-08-26

- id: sao
  sigla: SAO
  nome: Sumário de Alta Obstétrico

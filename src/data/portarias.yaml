    diretamente a Portaria SAES/MS nº 50/2022: o art. 5º revoga "o Capítulo IX
    e os Anexos LX e LXI da Portaria SAES/MS de Consolidação nº 1, de 22 de
    fevereiro de 2022", dispositivos onde os modelos de 2022 haviam sido
    consolidados. Não constava da página de legislação da RNDS no gov.br em
    09/10/2026.
  fontes:
    - tipo: bvs

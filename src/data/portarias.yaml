    Institui os modelos de informação de Registro Eletrônico da Prescrição de
    Medicamentos (REPM) e de Registro Eletrônico de Dispensação ou Fornecimento
    de Medicamentos (REDFM) no âmbito da Rede Nacional de Dados em Saúde.

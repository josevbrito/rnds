- id: gm-ms-8347-2025
  numero: GM/MS nº 8.347
  orgao: GM/MS
  data: 2025-10-08
  ementa: >-
    Institui o Modelo de Informação do Registro de Atendimento Clínico (RAC),
    no âmbito da Rede Nacional de Dados em Saúde (RNDS).
  status: vigente
  modelos: [rac]
  revoga: [gm-ms-234-2022]
  ausente_da_lista_oficial: true
  notas: >-
    Substitui integralmente o modelo do RAC instituído em 2022. O art. 5º traz a
    revogação expressa: "Fica revogada a Portaria GM/MS nº 234, de 18 de julho
    de 2022." Não constava da página de legislação da RNDS no gov.br em 26/08/2026.
  fontes:
    - tipo: conass
      titulo: Conass Informa n. 191/2025
      url: https://www.conass.org.br/conass-informa-n-191-2025-publicada-a-portaria-gm-n-8-347-que-institui-o-modelo-de-informacao-do-registro-de-atendimento-clinico-rac-no-ambito-da-rede-nacional-de-dados-em-saude/
  verificado_em: 2026-08-26


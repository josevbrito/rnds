    (RELC) na consolidação. Não traz revogação expressa. As especificações
    técnicas de envio ficam a cargo do Portal de Serviços do DATASUS. Não
    constava da página de legislação da RNDS no gov.br em 09/10/2026.
  fontes:
    - tipo: dou
      titulo: Diário Oficial da União - Portaria GM/MS nº 10.341/2026
      url: https://www.in.gov.br/web/dou/-/portaria-gm/ms-n-10.341-de-12-de-marco-de-2026-692755299
    - tipo: conass
      titulo: Conass Informa n. 47/2026

- id: saes-ms-50-2022
  numero: SAES/MS nº 50
  orgao: SAES/MS
  data: 2022-02-09
  ementa: >-
    Institui os modelos de informação de Registro de Prescrição de Medicamento
    (RPM) e de Registro de Dispensação de Medicamento (RDM) no âmbito da Rede
    Nacional de Dados em Saúde (RNDS).
  status: indeterminado
  modelos: [rpm, rdm]
  notas: >-
    Modelos originais de medicamento, sucedidos por REPM e REDFM na Portaria
    GM/MS nº 6.100/2024. A cadeia passa pela consolidação normativa: os modelos
    de 2022 foram consolidados na Portaria SAES/MS de Consolidação nº 1, de
    22/02/2022, e é o Capítulo IX (com os Anexos LX e LXI) dessa consolidação
    que a 6.100/2024 revoga, não esta portaria diretamente.
  fontes:
    - tipo: gov-br
      titulo: Legislação da RNDS - gov.br
      url: https://www.gov.br/saude/pt-br/composicao/seidigi/rnds/legislacao/portaria-saes-ms-no-50-de-9-de-fevereiro-de-2022

    Altera a Portaria de Consolidação nº 1, de 28 de setembro de 2017, para
    instituir o Modelo de Informação para Registro de Atendimento via
    Teleconsultoria (RATC) e o Modelo de Informação de Resultado de Exame com
    Laudo Clínico (RELC) no âmbito da Rede Nacional de Dados em Saúde (RNDS).

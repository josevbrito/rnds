- id: gm-ms-11952-2026
  numero: GM/MS nº 11.952
  orgao: GM/MS
  data: 2026-07-13
  ementa: >-
    Altera a Portaria de Consolidação nº 1, de 28 de setembro de 2017, para
    instituir o Modelo de Informação do Conjunto Mínimo de Dados (CMD).
  status: vigente
  modelos: [cmd]
  ausente_da_lista_oficial: true
  notas: >-
    Primeira norma a instituir formalmente o modelo do CMD. O anexo determina
    que as informações sejam "enviadas regularmente à RNDS" e atribui ao DATASUS
    as adequações para a operacionalização técnica do modelo na rede. Vigora
    desde a publicação, com efeitos operacionais na RNDS na competência
    seguinte. Não constava da página de legislação da RNDS no gov.br em
    09/10/2026.
  fontes:
    - tipo: conass
      titulo: Conass Informa n. 126/2026
      url: https://www.conass.org.br/altera-a-portaria-de-consolidacao-no-1-de-28-de-setembro-de-2017-para-instituir-o-modelo-de-informacao-do-conjunto-minimo-de-dados-cmd/
  verificado_em: 2026-10-09

- id: gm-ms-10341-2026

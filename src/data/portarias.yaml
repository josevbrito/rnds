- id: gm-ms-5663-2024
  numero: GM/MS nº 5.663
  orgao: GM/MS
  data: 2024-10-31
  ementa: >-
    Altera a Portaria de Consolidação GM/MS nº 1, de 2017, para padronizar e
    centralizar na RNDS os registros de vacinação.
  status: vigente
  modelos: [ria]
  ausente_da_lista_oficial: true
  notas: >-
    Não cria modelo novo: determina que os dados de vacinação sigam
    exclusivamente para a RNDS no modelo RIA vigente, via PEC, CDS ou sistema
    próprio integrado, com prazo de 24 horas para salas com conectividade e 15
    dias para as sem. Desativa a integração de vacinas pelo layout e-SUS LEDI
    APS (Thrift/XML). Ementa resumida, confira o texto no DOU. Não constava da
    página de legislação da RNDS no gov.br em 09/10/2026.
  fontes:
    - tipo: dou
      titulo: Diário Oficial da União - Portaria GM/MS nº 5.663/2024
      url: https://www.in.gov.br/web/dou/-/portaria-gm/ms-n-5.663-de-31-de-outubro-de-2024-593693777
  verificado_em: 2026-10-09

- id: saes-svsa-seidigi-25-2023
  numero: Portaria Conjunta SAES/SVSA/SEIDIGI nº 25
  orgao: SAES/SVSA/SEIDIGI
  data: 2023-11-27
  ementa: >-
    Institui o Modelo de Informação do Registro de Imunobiológico Administrado.
  status: vigente
  modelos: [ria]
  ausente_da_lista_oficial: true
  notas: >-
    Define o modelo do RIA em dois quadros, um para rotina e outro para
    campanha. Comunicado do Programa Nacional de Imunizações de 23/02/2026
    esclarece que, por esta portaria e pela GM/MS nº 5.663/2024, o RIA vigente
    é o RIA-R 2.0, que deve receber também as doses de campanha. É a norma que
    o Guia de Implementação oficial associa ao RIA. Não constava da página de
    legislação da RNDS no gov.br em 30/10/2026.
  fontes:
    - tipo: bvs
      titulo: BVS Saúde Legis - texto integral
      url: https://bvsms.saude.gov.br/bvs/saudelegis/Saes/2023/poc0025_30_11_2023.html
    - tipo: outro
      titulo: Comunicado DPNI/SVSA/MS de 23/02/2026 (SEI nº 0053610638), cópia publicada pela SBIm
      url: https://sbim.org.br/images/SEI_MS-0053610638-Comunicado.pdf_2026-02-26.pdf
    - tipo: ig
      titulo: Guia de Implementação da RNDS - modelos e portarias
      url: https://fhir.saude.gov.br/pt-BR/index.html

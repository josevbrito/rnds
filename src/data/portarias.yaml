- id: gm-ms-6100-2024
  numero: GM/MS nº 6.100
  orgao: GM/MS
  data: 2024-12-17
  ementa: >-
    Institui os modelos de informação de Registro Eletrônico da Prescrição de
    Medicamentos (REPM) e de Registro Eletrônico de Dispensação ou Fornecimento
    de Medicamentos (REDFM) no âmbito da Rede Nacional de Dados em Saúde.
  status: vigente
  modelos: [repm, redfm]
  ausente_da_lista_oficial: true
  notas: >-
    Marco da sucessão RPM → REPM e RDM → REDFM. A revogação NÃO atinge
    diretamente a Portaria SAES/MS nº 50/2022: o art. 5º revoga "o Capítulo IX
    e os Anexos LX e LXI da Portaria SAES/MS de Consolidação nº 1, de 22 de
    fevereiro de 2022", dispositivos onde os modelos de 2022 haviam sido
    consolidados. Não constava da página de legislação da RNDS no gov.br em
    26/08/2026.
  fontes:
    - tipo: bvs
      titulo: BVS Saúde Legis - texto integral
      url: https://bvsms.saude.gov.br/bvs/saudelegis/gm/2024/prt6100_18_12_2024.html
    - tipo: conass
      titulo: Conass Informa n. 218/2024
      url: https://www.conass.org.br/conass-informa-n-218-2024-publicada-a-portaria-gm-n-6-100-que-institui-os-modelos-de-informacao-de-registro-eletronico-da-prescricao-de-medicamentos-e-de-registro-eletronico-de-dispen/
  verificado_em: 2026-08-26

